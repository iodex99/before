# =============================================================================
# BEFORE — iOS CI.
#
# This is the workflow that closes the largest verification gap in the project:
# none of the Swift has ever been compiled, because it was written on Windows.
#
# The jobs are ordered by how much they cost and how likely they are to fail:
#
#   1. BeforeKit    pure Swift, no Xcode project, no simulator. Seconds.
#                   Runs the SAME score fixtures as the Node suite, so a drift
#                   between the two engines fails here.
#   2. Build        generates the Xcode project and compiles every target.
#   3. Test         unit and UI tests on a simulator.
#
# Expect job 2 to find real errors on its first run. That is what it is for.
# =============================================================================

name: iOS

on:
  push:
    branches: [main, master]
    paths: ['ios/**', 'backend/shared/fixtures/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'backend/shared/fixtures/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Fastest, and the one that matters most: the score engine.
  # ---------------------------------------------------------------------------
  beforekit:
    name: BeforeKit (score parity)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Pick the newest installed Xcode rather than naming a point release:
        # the runner image renames these between updates.
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - run: swift --version

      - name: Test
        # ScoreParityTests loads backend/shared/fixtures/score-cases.json by
        # walking up from #filePath, so the whole repo must be checked out —
        # not just the package.
        run: swift test --package-path ios/BeforeKit

  # ---------------------------------------------------------------------------
  # Compile everything.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Pick the newest installed Xcode rather than naming a point release:
        # the runner image renames these between updates.
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Configuration
        # Placeholders only. Nothing here is secret — the app is allowed to know
        # a project URL and a publishable anon key, and a build needs neither to
        # be real.
        run: |
          cat > ios/Config.xcconfig <<'EOF'
          URL_SLASHES = //
          APP_BUNDLE_ID = com.yourcompany.before
          APP_GROUP_IDENTIFIER = group.com.yourcompany.before
          SUPABASE_URL = https:$(URL_SLASHES)ci.invalid
          SUPABASE_ANON_KEY = ci-placeholder-anon-key
          TERMS_URL = https:$(URL_SLASHES)example.invalid/terms
          PRIVACY_URL = https:$(URL_SLASHES)example.invalid/privacy
          SUPPORT_EMAIL = ci@example.invalid
          EOF

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build
        # `SWIFT_COMPILATION_MODE=wholemodule` is here for the feedback loop, not
        # for the artefact. In the default incremental mode the frontend stops at
        # the first file it cannot type-check, so one run reports one file's
        # errors and hides every other file's — which cost this project two round
        # trips. Whole-module type-checks the target in one go and reports all of
        # them.
        #
        # No `| xcbeautify` and no `|| fallback`. The first version had both:
        # xcbeautify was not installed, so the pipeline failed, the fallback ran
        # a second build, and *its* unrelated destination error was the only
        # thing visible — burying six real compile errors from the first build.
        # A build step should fail with the compiler's own message.
        run: |
          xcodebuild build \
            -project ios/BEFORE.xcodeproj \
            -scheme BEFORE \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            SWIFT_COMPILATION_MODE=wholemodule \
            CODE_SIGNING_ALLOWED=NO

      - name: Summarise compile errors
        if: failure()
        # Surfaces the distinct errors in the job summary, so a failure is
        # readable without downloading a 4MB log.
        run: |
          echo "### Build failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Re-run locally with: \`make ios-build\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Unit and UI tests on a simulator.
  # ---------------------------------------------------------------------------
  test:
    name: Unit and UI tests
    runs-on: macos-15
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Pick the newest installed Xcode rather than naming a point release:
        # the runner image renames these between updates.
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Configuration
        run: |
          cat > ios/Config.xcconfig <<'EOF'
          URL_SLASHES = //
          APP_BUNDLE_ID = com.yourcompany.before
          APP_GROUP_IDENTIFIER = group.com.yourcompany.before
          SUPABASE_URL = https:$(URL_SLASHES)ci.invalid
          SUPABASE_ANON_KEY = ci-placeholder-anon-key
          TERMS_URL = https:$(URL_SLASHES)example.invalid/terms
          PRIVACY_URL = https:$(URL_SLASHES)example.invalid/privacy
          SUPPORT_EMAIL = ci@example.invalid
          EOF

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        # Hard-coding a device name breaks whenever the runner image changes its
        # simulator set, which it does. Ask instead.
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json,sys
          data = json.load(sys.stdin)['devices']
          for runtime, devices in sorted(data.items(), reverse=True):
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      print(d['udid']); sys.exit(0)
          sys.exit('no available iPhone simulator')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -i iphone | head -5

      - name: Test
        # Whole-module for the same reason as the Build job: incremental mode
        # reports the first file it cannot type-check and hides the rest.
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/BEFORE.xcodeproj \
            -scheme BEFORE \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            SWIFT_COMPILATION_MODE=wholemodule \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
