# =============================================================================
# BEFORE — XcodeGen project specification.
#
# The .xcodeproj is GENERATED, not committed. A hand-maintained pbxproj is the
# single most merge-hostile file in an iOS repo; this spec is reviewable.
#
#   brew install xcodegen
#   cd ios && xcodegen generate        (or: make ios-project)
#
# Before the first build, copy Config.xcconfig.example to Config.xcconfig and
# fill it in. See docs/SETUP.md.
# =============================================================================

name: BEFORE
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULE_VERIFIER: NO
    # Every target reads its configuration from here.
    "#include": Config.xcconfig
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

packages:
  BeforeKit:
    path: BeforeKit

# -----------------------------------------------------------------------------

targets:

  BEFORE:
    type: application
    platform: iOS
    sources:
      - path: BEFORE
        excludes:
          - "**/.DS_Store"
    resources:
      - path: BEFORE/Resources
    dependencies:
      - package: BeforeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: BEFORE
        INFOPLIST_FILE: BEFORE/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: BEFORE/Resources/BEFORE.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone. iPad is not designed for yet.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - BEFORETests
        - BEFOREUITests
      gatherCoverageData: true
      coverageTargets:
        - BEFORE
      environmentVariables:
        # Points the simulator at the local StoreKit configuration so purchases
        # can be tested without App Store Connect.
        SIMULATOR_STOREKIT_CONFIGURATION: StoreKit/Products.storekit
      commandLineArguments:
        "-BEFOREUseMockData": false

  BEFOREShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BEFOREShareExtension
      # Compiled into both targets rather than duplicated. This is the one file
      # the app and the extension genuinely share.
      - path: BEFORE/Core/SharedInbox.swift
    dependencies:
      - target: BEFORE
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).ShareExtension
        PRODUCT_NAME: BEFORE
        INFOPLIST_FILE: BEFOREShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BEFOREShareExtension/BEFOREShareExtension.entitlements

  BEFORETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BEFORETests
    dependencies:
      - target: BEFORE
      - package: BeforeKit
    settings:
      base:
        INFOPLIST_FILE: BEFORETests/Info.plist

  BEFOREUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BEFOREUITests
    dependencies:
      - target: BEFORE
    settings:
      base:
        INFOPLIST_FILE: BEFOREUITests/Info.plist
